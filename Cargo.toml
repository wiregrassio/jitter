# Two crates, one dependency direction. `jitter-core` is pure: parsers, the window reduction, and
# the line-protocol serializer, with no file, clock, or network access. `jitter` is the daemon:
# it reads the kernel, keeps time, and owns the one sink.

[workspace]
resolver = "3"
members = ["crates/jitter-core", "crates/jitter"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Let chains (1.88) set the floor. CI checks this version as well as the pinned toolchain.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wiregrassio/jitter"

[workspace.dependencies]
jitter-core = { path = "crates/jitter-core", version = "0.1.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
signal-hook = { version = "0.3", default-features = false }
toml = { version = "0.8", default-features = false, features = ["parse"] }

# House rules enforced at build time. Members opt in with `[lints] workspace = true`; test code
# carries its own allowance for the unwrap family.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

# A silent wraparound is the quiet corruption the design law exists to prevent, so overflow
# checks stay on in every profile.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
overflow-checks = true
