# The contribution gate, mechanical: format, lint with warnings denied, every test, a release
# build, and a smoke run against the runner's real kernel, on x86_64 and arm64. The toolchain
# comes from rust-toolchain.toml; actions are pinned by commit.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p jitter
      - run: ci/smoke.sh target/release/jitter

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-targets --locked
